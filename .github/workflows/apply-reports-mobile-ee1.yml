name: Apply reports mobile EE1
on:
  workflow_dispatch:
  push:
    branches: [fix/reports-mobile-ee1-display]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reports-mobile-ee1-display
      - run: node scripts/apply-reports-mobile-ee1.mjs
      - run: |
          grep -q calculateCbcSubLevel src/pages/ReportsPage.jsx
          grep -q EE1 src/pages/GradesPage.jsx
          echo OK
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pages/ReportsPage.jsx src/pages/GradesPage.jsx src/styles/layout-foundation.css
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix(ui): reports mobile + EE1-BE2 on grades/reports"
            git push origin HEAD:fix/reports-mobile-ee1-display
          fi
