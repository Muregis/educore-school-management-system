name: Apply class streams API
on:
  workflow_dispatch:
  push:
    branches: [feature/class-streams-api]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/class-streams-api
      - run: node scripts/apply-class-streams-api.mjs
      - run: grep -q 'POST /api/classes - Create a class' backend/src/routes/classes.routes.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/classes.routes.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "feat(classes): POST/PATCH section for multi-stream"
            git push origin HEAD:feature/class-streams-api
          fi
