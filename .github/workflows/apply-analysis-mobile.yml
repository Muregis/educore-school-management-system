name: Apply analysis mobile layout
on:
  workflow_dispatch:
  push:
    branches: [fix/analysis-mobile-layout]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analysis-mobile-layout
      - name: Decode and apply
        run: |
          if [ -f scripts/apply-m-b64-0.txt ]; then
            cat scripts/apply-m-b64-0.txt scripts/apply-m-b64-1.txt | base64 -d > scripts/apply-analysis-mobile.mjs
          elif [ -f scripts/apply-analysis-mobile.b64 ]; then
            base64 -d scripts/apply-analysis-mobile.b64 > scripts/apply-analysis-mobile.mjs
          fi
          node scripts/apply-analysis-mobile.mjs
      - run: |
          grep -q analysis-rank-cards src/pages/AnalysisPage.jsx
          grep -q 'ANALYSIS PAGE MOBILE' src/styles/layout-foundation.css
          if grep -q 'width: 120' src/pages/AnalysisPage.jsx; then echo 'still has width 120'; exit 1; fi
          echo OK
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnalysisPage.jsx src/styles/layout-foundation.css
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix(analysis): mobile layout - rank cards, flexible filters"
            git push origin HEAD:fix/analysis-mobile-layout
          fi
