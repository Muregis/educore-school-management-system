name: Apply Fees fix

on:
  workflow_dispatch:
  push:
    branches: [fix/fees-term-filter-receipt]
    paths:
      - "scripts/fees-page.patch"
      - "scripts/apply-fees-fix.mjs"
      - ".github/workflows/apply-fees-fix.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fees-term-filter-receipt
      - name: Apply FeesPage patch
        run: node scripts/apply-fees-fix.mjs
      - name: Verify markers
        run: |
          grep -q 'paymentsTermParam' src/pages/FeesPage.jsx
          grep -q '+ Manual Payment' src/pages/FeesPage.jsx
          grep -q 'Receipt' src/pages/FeesPage.jsx
          ! grep -q '+ Record Payment' src/pages/FeesPage.jsx
          echo "FeesPage markers OK"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pages/FeesPage.jsx
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "fix(fees): apply term filter, manual payment only, receipt row action"
            git push origin fix/fees-term-filter-receipt
          fi
