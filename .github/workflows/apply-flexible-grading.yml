name: Check flexible grading branch
on:
  workflow_dispatch:
  push:
    branches: [fix/flexible-grading-and-streams]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check backend/src/utils/gradingBands.js
          node --check backend/src/utils/knecGrading.js
          node --check backend/src/routes/classes.routes.js
          node --check backend/src/routes/analysis.routes.js
          node --check backend/src/routes/grades.routes.js
          node --check backend/src/routes/settings.routes.js
          test -f database/scripts/demo_grade2_streams.sql
          grep -q router.post backend/src/routes/classes.routes.js
          grep -q loadSchoolGradingBands backend/src/utils/gradingBands.js
          grep -q loadSchoolGradingBands backend/src/routes/analysis.routes.js
          grep -q grading-bands backend/src/routes/settings.routes.js
          echo OK
