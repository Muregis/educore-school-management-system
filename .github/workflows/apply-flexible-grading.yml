name: Apply flexible grading and streams
on:
  workflow_dispatch:
  push:
    branches: [fix/flexible-grading-and-streams]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flexible-grading-and-streams
      - run: node scripts/assemble-flexible-grading.mjs
      - run: |
          node --check backend/src/routes/analysis.routes.js
          node --check backend/src/routes/grades.routes.js
          node --check backend/src/routes/settings.routes.js
          node --check backend/src/utils/gradingBands.js
          grep -q loadSchoolGradingBands backend/src/routes/analysis.routes.js
          grep -q 'POST /api/classes' backend/src/routes/classes.routes.js || true
          echo OK
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/analysis.routes.js backend/src/routes/grades.routes.js backend/src/routes/settings.routes.js
          if git diff --staged --quiet; then echo No route changes; else
            git commit -m "fix: wire flexible grading into analysis, grades, settings"
            git push origin HEAD:fix/flexible-grading-and-streams
          fi
