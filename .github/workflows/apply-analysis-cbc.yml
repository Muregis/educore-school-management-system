name: Apply analysis CBC sub-levels
on:
  workflow_dispatch:
  push:
    branches: [fix/analysis-cbc-sublevels]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analysis-cbc-sublevels
      - run: node scripts/apply-analysis-cbc.mjs
      - run: |
          grep -q calculateCbcSubLevel src/pages/AnalysisPage.jsx
          grep -q sub_level_distribution backend/src/routes/analysis.routes.js
          echo OK
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnalysisPage.jsx backend/src/routes/analysis.routes.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix(analysis): CBC EE1-BE2 grades, class mean band, sub-level distribution"
            git push origin HEAD:fix/analysis-cbc-sublevels
          fi
