name: Apply store EE1 minimal
on:
  workflow_dispatch:
  push:
    branches: [fix/grades-store-ee1-minimal]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grades-store-ee1-minimal
      - run: node scripts/apply-store-ee1-minimal.mjs
      - run: |
          node --check backend/src/routes/grades.routes.js
          grep -q 'calculatedGrade.grade || calculatedGrade.level' backend/src/routes/grades.routes.js
          echo OK
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/grades.routes.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix(grades): persist EE1-BE2 not parent level only"
            git push origin HEAD:fix/grades-store-ee1-minimal
          fi
